name: Release Zeitmanager

on:
  push:
    branches:
      - main
    paths:
      - ".release-version"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version prüfen
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < .release-version)"
          MANIFEST_VERSION="$(python - <<'PY'
          import json
          with open("custom_components/time_manager/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"
          if [ -z "$VERSION" ]; then
            echo "Keine Release-Version angegeben."
            exit 1
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release-Version $VERSION stimmt nicht mit manifest.json $MANIFEST_VERSION überein."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: HACS validieren
        uses: hacs/action@main
        with:
          category: integration

      - name: Hassfest validieren
        uses: home-assistant/actions/hassfest@master

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Zeitmanager $VERSION" \
            --generate-notes
